name: temp-game-cover-collage

on:
  push:
    branches:
      - tmp-game-covers-collage-20260927

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build 3x3 cover collage
        shell: bash
        run: |
          python -m pip install --quiet pillow requests
          cat > /tmp/build_collage.py <<'PY'
          from PIL import Image, ImageOps
          import requests, io, os

          UA = {'User-Agent': 'Mozilla/5.0'}
          covers = [
              ('Fallout 2', [
                  'https://m.media-amazon.com/images/M/MV5BMWE4ZDViM2EtYmU4YS00YTQ4LWI2NGMtMGFjMmE2YmZlN2VhXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg',
                  'https://upload.wikimedia.org/wikipedia/en/c/c3/PC_Game_Fallout_2.jpg',
              ]),
              ('Half-Life', [
                  'https://cdn.mos.cms.futurecdn.net/BcJjp5eKrp4agmwXAKECML.jpg',
                  'https://upload.wikimedia.org/wikipedia/en/f/fa/Half-Life_Cover_Art.jpg',
              ]),
              ('Diablo II', [
                  'https://gamepedia.cursecdn.com/gamia_gamepedia_en/4/4d/Front-Cover-Diablo-II-NA-PC.jpg',
                  'https://upload.wikimedia.org/wikipedia/en/d/d5/Diablo_II_Coverart.png',
              ]),
              ('Star Wars: Dark Forces', [
                  'https://i.ebayimg.com/images/g/PhcAAOSwCzdkk9P6/s-l1200.webp',
                  'https://i.ebayimg.com/images/g/TtgAAOSwtEtmOlaU/s-l1200.png',
              ]),
              ('Capcom vs. SNK 2', [
                  'https://i5.walmartimages.com/asr/73c2d641-d3fe-4ba9-9bbd-9f22935ab8b0.bd73c9b82f9b9dea52948131103bfe7f.jpeg',
                  'https://upload.wikimedia.org/wikipedia/en/2/22/Capcom_vs_SNK_2.png',
              ]),
              ('League of Legends', [
                  'https://i.ebayimg.com/images/g/KBcAAOSw-m1kmgv1/s-l1600.jpg',
                  'https://gamefaqs.gamespot.com/a/box/6/7/4/105674_front.jpg',
              ]),
              ('Guitar Hero II', [
                  'https://www.thevideogamecompany.com/cdn/shop/products/guitar-hero-ii-sony-playstation-2-ps2-047875950351-cover-art.jpg?v=1656648132&width=2048',
                  'https://upload.wikimedia.org/wikipedia/en/8/83/Guitar_Hero_II.jpg',
              ]),
              ('Final Fantasy VII', [
                  'https://www.thevideogamecompany.com/cdn/shop/products/final-fantasy-vii-sony-playstation-1-ps1-711719416326-cover-art.jpg?v=1657399948&width=2048',
                  'https://upload.wikimedia.org/wikipedia/en/c/c2/Final_Fantasy_VII_Box_Art.jpg',
              ]),
              ('Duke Nukem 3D', [
                  'https://upload.wikimedia.org/wikipedia/en/6/61/Duke_Nukem_3D_Coverart.png',
                  'https://www.mobygames.com/images/covers/l/728780-duke-nukem-3d-dos-manual.png',
              ]),
          ]

          def get_image(name, urls):
              errors=[]
              for url in urls:
                  try:
                      r=requests.get(url, headers=UA, timeout=30)
                      r.raise_for_status()
                      im=Image.open(io.BytesIO(r.content))
                      im.load()
                      print(name, im.size, url)
                      return im.convert('RGB')
                  except Exception as e:
                      errors.append(f'{url}: {e}')
              raise RuntimeError(name+' failed: '+' | '.join(errors))

          cell=512
          canvas=Image.new('RGB',(cell*3,cell*3),(0,0,0))
          for i,(name,urls) in enumerate(covers):
              im=get_image(name,urls)
              tile=ImageOps.fit(im,(cell,cell),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
              x=(i%3)*cell; y=(i//3)*cell
              canvas.paste(tile,(x,y))
          os.makedirs('/tmp/out',exist_ok=True)
          canvas.save('/tmp/out/9_games_that_shaped_my_childhood.png', optimize=True)
          canvas.save('/tmp/out/9_games_that_shaped_my_childhood_X.jpg', quality=95, subsampling=0, optimize=True)
          PY
          python /tmp/build_collage.py
      - uses: actions/upload-artifact@v4
        with:
          name: nine-game-cover-collage
          path: /tmp/out/*
          if-no-files-found: error
          retention-days: 1
